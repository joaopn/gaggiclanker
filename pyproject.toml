[project]
name = "gaggiclanker"
version = "0.1.0"
description = "Archive, diagnose and analyse espresso shots from a GaggiMate machine."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Imported directly by settings.py (dotenv_values) to feed the runtime
    # registry the same file pydantic-settings reads, so it is a declared
    # dependency rather than one inherited from pydantic-settings.
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    # The device transport. aiohttp for HTTP (bounded concurrency, binary
    # bodies) and for the in-process fake device's server; websockets for the
    # one persistent client connection.
    "aiohttp>=3.10",
    "websockets>=13.0",
    "sse-starlette>=2.1",
    # Multipart form parsing, which is how the JSON importer takes
    # files. FastAPI needs it present to declare an UploadFile parameter at
    # all, so it is a hard dependency rather than an extra.
    "python-multipart>=0.0.18",
    "structlog>=24.4",
    "openai>=3.13.0",
    "anthropic>=1.5.0",
    "pyyaml>=6.0.3",
    # Auth. PyJWT signs and verifies the HS256 session token; argon2-cffi
    # hashes the password. argon2id rather than bcrypt because bcrypt silently
    # truncates at 72 bytes and has no memory cost, and this password protects a
    # box on a home LAN where the only rate limit is the one we wrote.
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "mcp>=2,<3",
]

[project.scripts]
gaggiclanker = "gaggiclanker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
    # The suite runs in parallel by default (see addopts below): serially it
    # takes longer than the five minutes a gate can afford.
    "pytest-xdist>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaggiclanker"]

# Note: hatchling ships everything under gaggiclanker/, the migration .sql
# files included, so the wheel and the container image carry the schema.

[tool.ruff]
line-length = 100
target-version = "py313"
# Ruff formats Python code blocks inside Markdown. external/ holds reference
# clones of other people's projects, which are not ours to rewrite. Our own
# prose is excluded for the same reason: the code in it is illustrative, not
# compiled.
extend-exclude = ["external", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert: pytest uses it, and we use it for invariants
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals, hardcode fake secrets and bind test ports.
# ASYNC240: a test asserting on a file it just wrote is allowed to stat it
# directly; there is no event loop latency to protect in a test.
# ASYNC109/110: a test helper that waits for the fake device to do something
# takes a `timeout` and polls a plain bool that uvicorn exposes; neither is the
# production pattern those rules are protecting.
"tests/**" = ["S105", "S106", "S108", "ASYNC109", "ASYNC110", "ASYNC240"]
# The diagnostics tests are a port of gaggimate-mcp's own suite (see
# gaggiclanker/domain/VENDORED.md). They are kept as close to upstream as the
# renamed entry points allow, because their value is the exact numbers they
# assert — reflowing them to our house style would make the next upstream diff
# unreadable and risk moving a threshold by accident.
"tests/domain/test_diagnostics.py" = ["B905", "C408", "RUF003", "RUF015", "RUF059"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `-m "not simulator"` is what makes the simulator tests opt-in: the marker
# alone only labels them. An explicit `-m simulator` on the command line
# replaces this one (pytest takes the last -m), which is exactly the override
# `scripts/sim.sh test` relies on.
#
# `-n auto --dist load`: one worker per core, tests handed out individually.
# Serially the suite takes four to six minutes; in parallel well under one.
# Every test already gets its own DATA_DIR, SQLite file and fake machine on
# port 0, so workers share nothing but the CPU. `load` rather than `loadfile`
# because the slow tests cluster in a few files (sync, device) and per-file
# scheduling leaves most workers idle while one grinds through them. Starting
# the workers costs several seconds, so for a quick run over one file pass
# `-n 0`. `scripts/sim.sh test` passes it too: there is one simulator.
addopts = "-q --strict-markers -m \"not simulator\" -n auto --dist load"
markers = [
    # Opt-in: integration tests that need the GaggiMate firmware simulator
    # (`pio run -e display-sim -t run`) listening on localhost:8080.
    "simulator: requires a running GaggiMate display-sim",
]

[tool.mypy]
python_version = "3.13"
files = ["gaggiclanker", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# The diagnostics tests are a port of gaggimate-mcp's own suite (see
# gaggiclanker/domain/VENDORED.md), kept in upstream's shape so the next
# upstream diff stays readable. They index the diagnostics TypedDicts directly
# — `d["resistance"]["avg"]` — where our versions are `| None` because a
# machine without a pressure sensor has no resistance block. Threading an
# assertion through 1 500 lines of vendored test would obscure exactly the
# numbers those tests exist to pin. The engine they exercise is checked in
# full; this is the one module where that is relaxed.
module = "tests.domain.test_diagnostics"
disallow_untyped_calls = false
disallow_untyped_defs = false
check_untyped_defs = false
warn_return_any = false
