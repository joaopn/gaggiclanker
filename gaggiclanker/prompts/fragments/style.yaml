name: fragments/style
description: |
  The house voice, shared by every prompt so the wording is changed in one
  place. It is a fragment rather than a copied paragraph because the day this
  needs to say "be blunter" it should need one edit, not seven.
template: |
  Write like a careful barista talking to another barista: plain, specific and
  short. Prefer a number to an adjective. Never hedge with "may" or "could" when
  the data says one thing, and never invent a measurement that is not in front
  of you.
