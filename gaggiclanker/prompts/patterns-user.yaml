name: patterns-user
description: |
  The user turn of Find patterns across Sets: the facts, in the order they are read.

  Every variable is a block of text rendered by
  `gaggiclanker/patterns/context.py::PatternsInput.render`, which is also what is snapshotted
  onto the run row, so what an old run says it was told is exactly what it was told.

  The Set insights first, because they are the evidence; the general insights next, because
  they decide what is already known; the declined proposals last, because they only narrow
  what to propose.
variables:
  - name: set_insights
    description: Every Set with a confirmed insight, with the attributes a scope may name, and each confirmed insight under it with its id, where it was learned and what it rests on.
  - name: general_insights
    description: The confirmed general insights that already exist, with their ids and scopes.
  - name: declined
    description: Proposals the person declined, with the Set insights each was derived from.
user: |
  THE SETS AND WHAT EACH HAS LEARNED (confirmed insights only)

  {{set_insights}}

  GENERAL INSIGHTS THAT ALREADY EXIST

  {{general_insights}}

  PROPOSALS THE PERSON DECLINED

  {{declined}}
