# Tier 1 of the knowledge base: structured dial-in rules.
#
# ─────────────────────────────────────────────────────────────────────
# ATTRIBUTION
#
# The dial-in heuristics below are adapted from **gaggimate-barista** by
# Charlie Hall (MIT licence), by way of **gaggimate-mcp** by Julian Leopold
# (MIT licence), whose `knowledge/` corpus condenses them. The condensed list
# this file was seeded from is that corpus;
# the originals are the ~21 000 words under `external/gaggimate-mcp/knowledge/`.
# Individual rules cite further sources in `source` / `source_ref`: Lance
# Hedrick for the tasting method, Scott Rao for the sour-and-bitter channeling
# rule, INEI for the traditional espresso standard, and crema for the taste
# vocabulary and the diagnostic bands.
#
# The diagnostic band meanings are **ours**. They describe the thresholds in
# `gaggiclanker/domain/diagnostics.py`, which are upstream's calibration
# measured against real shots.
#
# They are deliberately *not* word-for-word with
# `web/src/lib/shots.ts::BAND_MEANINGS`. That table explains one label to a
# reader looking at a card and is shared across metrics — "GOOD" means the same
# sentence under pressure adherence and under flow adherence. These rules are
# per metric and carry the interpretation the analyzer needs, which is the part
# worth having: flow_adherence says *why* flow deviation is the better grind
# signal, and the card has no room for that. What IS pinned, by
# `tests/analyzer/test_band_parity.py`, is coverage — every band label the
# diagnostics engine can emit has a rule here and a line there, so adding a band
# to `diagnostics.py` and forgetting one of the two is a failing test rather
# than a silent gap.
# ─────────────────────────────────────────────────────────────────────
#
# SHAPE. Each rule carries:
#
#   category    one of gaggiclanker.domain.vocab.RULE_CATEGORIES
#   key         unique within its category; stable, because the model is asked
#               to list the keys it used and the UI links them
#   applies     the conditions under which the rule is selected. An absent
#               dimension means "does not care"; `signal` matches if ANY of its
#               tokens is present. The token grammar is in
#               gaggiclanker/knowledge/rules.py.
#   value       the fact. `text` is the one sentence the prompt renders and the
#               UI shows; every other key is the machine-readable form of the
#               same fact, for a chart or a later chunk to use.
#   unit        what the numbers in `value` are in
#   confidence  expert | calibrated | anecdotal | learned
#   source / source_ref   provenance, shown in the UI beside the rule
#
# Editing a rule here changes the shipped default. A rule someone has edited
# through the API keeps their text and takes the new default, exactly like a
# prompt (gaggiclanker/llm/prompts.py explains the three-way upsert).

rules:

  # ── dial-in order ──────────────────────────────────────────────────
  # Always selected: this is the procedure, not a fact about a bean.

  - category: dial_in_order
    key: hierarchy
    applies: {}
    value:
      text: >-
        Work the variables in order and stop at the first that explains the
        problem: 1 grind (shot time more than 5 s off target, or clearly sour or
        bitter), 2 dose and yield (time is fine but the taste is not — sour or
        salty means +5 g out, bitter or drying means -5 g out), 3 temperature
        (flat, sharp, or no sweetness), 4 pressure and profile (character rather
        than extraction), 5 puck prep (sour AND bitter together, or shot-to-shot
        inconsistency).
      order: [grind, yield, temperature, pressure, puck_prep]
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Hierarchy"

  - category: dial_in_order
    key: one_variable_at_a_time
    applies: {}
    value:
      text: >-
        Change one variable at a time. Two changes in one shot make the next cup
        uninterpretable, and the whole point of a Set version is to be able to
        say what a single change did.
    unit: none
    confidence: expert
    source: crema
    source_ref: "crema.md §5 — review system prompt"

  - category: dial_in_order
    key: taste_is_ground_truth
    applies: {}
    value:
      text: >-
        The user's tasting notes outrank the telemetry. Sour, weak or fast means
        under-extracted; bitter, harsh or slow means over-extracted — whatever
        the curve looked like. Never contradict a recorded taste with a number.
    unit: none
    confidence: expert
    source: crema
    source_ref: "crema.md §5 — TASTING NOTES are ground truth"

  - category: dial_in_order
    key: grind_before_profile
    applies: {}
    value:
      text: >-
        If grind is plausibly the problem, propose no profile change at all. A
        profile edit made while the grind is wrong hides the grind error and
        costs two shots to unpick.
    unit: none
    confidence: expert
    source: crema
    source_ref: "crema.md §5 — dial-in order"

  # ── increments ─────────────────────────────────────────────────────

  - category: increments
    key: grind
    applies: {}
    value:
      text: >-
        Move the grinder in its own smallest meaningful step — one or two — and
        say which way in the grinder's units, never in microns.
      min: 1
      max: 2
    unit: grinder_steps
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — increments"

  - category: increments
    key: temperature
    applies: {}
    value:
      text: "Adjust brew temperature in 1 °C steps; 2 °C at most in one move."
      min: 1
      max: 2
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — increments"

  - category: increments
    key: pressure
    applies: {}
    value:
      text: "Adjust pressure in 0.5-1 bar steps."
      min: 0.5
      max: 1.0
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — increments"

  - category: increments
    key: yield
    applies: {}
    value:
      text: "Adjust yield in 5 g steps — about half a ratio point on a normal dose."
      step: 5
    unit: g
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — increments"

  - category: increments
    key: preinfusion_time
    applies: {}
    value:
      text: "Adjust pre-infusion in 2-3 s steps."
      min: 2
      max: 3
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — increments"

  - category: increments
    key: preinfusion_flow
    applies: {}
    value:
      text: "Adjust pre-infusion flow in 0.5 ml/s steps."
      step: 0.5
    unit: ml_s
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — increments"

  # ── temperature by roast ───────────────────────────────────────────

  - category: temperature_by_roast
    key: light
    applies: { roast_level: [light] }
    value:
      text: "Light roasts extract at 94-96 °C: the cell structure is dense and needs the heat."
      min_c: 94
      max_c: 96
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Temperature by roast"

  - category: temperature_by_roast
    key: medium_light
    applies: { roast_level: [medium-light] }
    value:
      text: "Medium-light roasts sit at 93-95 °C, between the light and medium windows."
      min_c: 93
      max_c: 95
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Temperature by roast"

  - category: temperature_by_roast
    key: medium
    applies: { roast_level: [medium] }
    value:
      text: "Medium roasts extract at 92-94 °C."
      min_c: 92
      max_c: 94
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Temperature by roast"

  - category: temperature_by_roast
    key: medium_dark
    applies: { roast_level: [medium-dark] }
    value:
      text: "Medium-dark roasts extract at 90-92 °C; above that the bitters come out early."
      min_c: 90
      max_c: 92
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Temperature by roast"

  - category: temperature_by_roast
    key: dark
    applies: { roast_level: [dark] }
    value:
      text: "Dark roasts extract at 88-90 °C: the cell walls are already broken down."
      min_c: 88
      max_c: 90
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Temperature by roast"

  - category: temperature_by_roast
    key: decaf
    applies: { decaf: true }
    value:
      text: >-
        Decaf extracts faster and hotter than its roast level suggests: take
        2-4 °C off the window for the same roast in caffeinated beans.
      offset_min_c: -4
      offset_max_c: -2
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Temperature by roast"

  - category: temperature_by_roast
    key: high_altitude
    applies: { signal: ["altitude:high"] }
    value:
      text: >-
        Beans grown above about 1 800 m are denser: add 1-2 °C and grind a step
        finer than the roast level alone would say.
      offset_min_c: 1
      offset_max_c: 2
      altitude_m_above: 1800
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Temperature by roast"

  - category: temperature_by_roast
    key: taste_adjustment
    applies: { signal: ["taste:sour", "taste:bitter", "taste:astringent",
                    "balance:sour", "balance:bitter"] }
    value:
      text: >-
        Within the roast's window, sour moves the temperature up 1-2 °C and
        bitter or astringent moves it down 1-2 °C — after grind and yield have
        been ruled out, not before.
      sour_offset_c: 1.5
      bitter_offset_c: -1.5
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Temperature by roast"

  - category: temperature_by_roast
    key: processing_offset
    applies: { process: [natural, anaerobic, honey] }
    value:
      text: >-
        More fermentation means more soluble material: heavily fermented lots
        (natural, honey, anaerobic) extract a degree or two cooler than a washed
        bean of the same roast, with a longer pre-infusion and a coarser grind.
      offset_c: -1.5
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Processing"

  # ── pressure matrix (roast x process) ──────────────────────────────
  # Roast levels are bucketed the way the source matrix is: light and
  # medium-light read the L column, medium the M, medium-dark and dark the D.

  - category: pressure_matrix
    key: washed.light
    applies: { process: [washed], roast_level: [light, medium-light] }
    value:
      text: "Washed light: 8-9 bar. A clean, dense bean takes full pressure."
      min_bar: 8
      max_bar: 9
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: washed.medium
    applies: { process: [washed], roast_level: [medium] }
    value:
      text: "Washed medium: 9 bar, the traditional setpoint."
      min_bar: 8.5
      max_bar: 9
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: washed.dark
    applies: { process: [washed], roast_level: [medium-dark, dark] }
    value:
      text: "Washed dark: 7-8 bar. A brittle bed channels at nine."
      min_bar: 7
      max_bar: 8
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: natural.light
    applies: { process: [natural], roast_level: [light, medium-light] }
    value:
      text: "Natural light: 7-8 bar — more soluble than washed, so less pressure."
      min_bar: 7
      max_bar: 8
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: natural.medium
    applies: { process: [natural], roast_level: [medium] }
    value:
      text: "Natural medium: 8-9 bar."
      min_bar: 8
      max_bar: 9
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: natural.dark
    applies: { process: [natural], roast_level: [medium-dark, dark] }
    value:
      text: "Natural dark: 6-7 bar. Muddy naturals want a bar off whatever you were using."
      min_bar: 6
      max_bar: 7
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: honey.light
    applies: { process: [honey], roast_level: [light, medium-light] }
    value:
      text: >-
        Honey light: 8-9 bar for a yellow honey, 7-8 for a red or black one —
        the longer the mucilage stayed on, the lower the pressure.
      min_bar: 7
      max_bar: 9
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: honey.medium
    applies: { process: [honey], roast_level: [medium] }
    value:
      text: "Honey medium: 8-9 bar."
      min_bar: 8
      max_bar: 9
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: honey.dark
    applies: { process: [honey], roast_level: [medium-dark, dark] }
    value:
      text: "Honey dark: 7-8 bar."
      min_bar: 7
      max_bar: 8
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: anaerobic.light
    applies: { process: [anaerobic], roast_level: [light, medium-light] }
    value:
      text: "Anaerobic light: 6-8 bar. The most soluble category there is."
      min_bar: 6
      max_bar: 8
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: anaerobic.medium
    applies: { process: [anaerobic], roast_level: [medium] }
    value:
      text: "Anaerobic medium: 7-8 bar."
      min_bar: 7
      max_bar: 8
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: anaerobic.dark
    applies: { process: [anaerobic], roast_level: [medium-dark, dark] }
    value:
      text: "Anaerobic dark: 6-7 bar."
      min_bar: 6
      max_bar: 7
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure matrix"

  - category: pressure_matrix
    key: compression_floor
    applies: {}
    value:
      text: >-
        A puck compresses at about 4 bar, so pre-infusion belongs below that:
        pressure applied before the bed has set is what opens a channel.
      bar: 4
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure"

  - category: pressure_matrix
    key: flow_peak
    applies: {}
    value:
      text: >-
        Flow through an espresso puck peaks around 9 bar. Above about 10 the
        extra pressure goes into deforming the bed rather than through it.
      peak_bar: 9
      channel_above_bar: 10
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure"

  - category: pressure_matrix
    key: decline_compensates_erosion
    applies: {}
    value:
      text: >-
        A declining pressure phase compensates for the puck eroding: as
        resistance falls, dropping the setpoint keeps flow where it was instead
        of letting the shot run away at the end.
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Pressure"

  # ── ratio by style ─────────────────────────────────────────────────

  - category: ratio_by_style
    key: classic
    applies: { style: [classic] }
    value:
      text: "Classic espresso: 1:2. Start there and let the taste move it."
      min: 1.8
      max: 2.2
    unit: none
    confidence: expert
    source: INEI / gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Ratio"

  - category: ratio_by_style
    key: turbo
    applies: { style: [turbo] }
    value:
      text: >-
        Turbo shots need 1:2.5-1:3. A turbo that tastes sour is almost always a
        ratio that was too short, not a grind that was too coarse.
      min: 2.5
      max: 3.0
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Ratio, Fixes"

  - category: ratio_by_style
    key: allonge
    applies: { style: [allonge] }
    value:
      text: "Allongé: 1:3 to 1:5, low pressure, long."
      min: 3.0
      max: 5.0
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Ratio"

  - category: ratio_by_style
    key: lever
    applies: { style: [lever] }
    value:
      text: "Lever profiles run about 1:2 to 1:2.5 over a long declining pressure."
      min: 2.0
      max: 2.5
    unit: none
    confidence: anecdotal
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Ratio"

  - category: ratio_by_style
    key: dark
    applies: { style: [dark] }
    value:
      text: "Dark-roast profiles are short: 1:1.5 to 1:2 keeps the bitters out."
      min: 1.5
      max: 2.0
    unit: none
    confidence: anecdotal
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Ratio"

  - category: ratio_by_style
    key: bloom
    applies: { style: [bloom] }
    value:
      text: "A bloom profile aims at about 1:2 to 1:2.5; the soak does the work, not the ratio."
      min: 2.0
      max: 2.5
    unit: none
    confidence: anecdotal
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Ratio"

  - category: ratio_by_style
    key: ristretto_and_milk
    applies: {}
    value:
      text: "For milk drinks and ristretto, 1:1 to 1:1.5 is the working range."
      min: 1.0
      max: 1.5
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Ratio"

  # ── time by style ──────────────────────────────────────────────────

  - category: time_by_style
    key: classic
    applies: { style: [classic] }
    value:
      text: "Traditional espresso runs 25-35 s from first pump to the target."
      min_s: 25
      max_s: 35
    unit: seconds
    confidence: expert
    source: INEI / gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Time by style"

  - category: time_by_style
    key: turbo
    applies: { style: [turbo] }
    value:
      text: "Turbo shots finish in 10-20 s at 5-6 bar."
      min_s: 10
      max_s: 20
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Time by style"

  - category: time_by_style
    key: allonge
    applies: { style: [allonge] }
    value:
      text: "Allongé runs long: 25-50 s."
      min_s: 25
      max_s: 50
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Time by style"

  - category: time_by_style
    key: bloom
    applies: { style: [bloom] }
    value:
      text: "A bloom profile totals 30-45 s, with first drip between 15 and 25 s."
      min_s: 30
      max_s: 45
      first_drip_min_s: 15
      first_drip_max_s: 25
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Time by style"

  - category: time_by_style
    key: lever
    applies: { style: [lever] }
    value:
      text: "Lever profiles run 28-35 s including the soak."
      min_s: 28
      max_s: 35
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Time by style"

  - category: time_by_style
    key: dark
    applies: { style: [dark] }
    value:
      text: "Dark-roast profiles are quick: 22-28 s."
      min_s: 22
      max_s: 28
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Time by style"

  - category: time_by_style
    key: first_drip
    applies: { signal: ["first_drip:fast", "first_drip:slow"] }
    value:
      text: >-
        First drip under 3 s means the grind is too coarse or the water found a
        channel; over 10 s means it is very fine.
      fast_below_s: 3
      slow_above_s: 10
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  # ── diagnostic band meanings ───────────────────────────────────────
  # One per band label the summary diagnostics can carry. Keys are
  # `<metric>:<LABEL>` and the wording is kept in step with
  # web/src/lib/shots.ts::BAND_MEANINGS so the analyzer and the shot page agree.

  - category: band_meanings
    key: "channeling_risk:LOW"
    applies: { signal: ["channeling_risk:LOW"] }
    value: { text: "channeling_risk LOW — no indicator crossed its threshold; the puck held." }
    unit: none
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — channeling"

  - category: band_meanings
    key: "channeling_risk:MODERATE"
    applies: { signal: ["channeling_risk:MODERATE"] }
    value:
      text: >-
        channeling_risk MODERATE — two or three indicators fired; read them with
        the flow shape before acting.
    unit: none
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — channeling"

  - category: band_meanings
    key: "channeling_risk:HIGH"
    applies: { signal: ["channeling_risk:HIGH"] }
    value:
      text: >-
        channeling_risk HIGH — four or five aligned indicators; a channel almost
        certainly opened. Fix distribution before grind.
    unit: none
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — channeling"

  - category: band_meanings
    key: "channeling_risk:VERY_HIGH"
    applies: { signal: ["channeling_risk:VERY_HIGH"] }
    value:
      text: >-
        channeling_risk VERY_HIGH — six or more indicators: the water found a
        path around the bed. Nothing else in the shot can be read past this.
    unit: none
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — channeling"

  - category: band_meanings
    key: "channeling_risk:INSUFFICIENT_DATA"
    applies: { signal: ["channeling_risk:INSUFFICIENT_DATA"] }
    value:
      text: >-
        channeling_risk INSUFFICIENT_DATA — fewer than five steady-state
        samples, so nothing was assessed. Treat the other diagnostics as primary.
    unit: none
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — channeling"

  - category: band_meanings
    key: "resistance_level:VERY_LOW"
    applies: { signal: ["resistance_level:VERY_LOW"] }
    value: { text: "resistance_level VERY_LOW — under 0.5; water is passing almost unimpeded." }
    unit: none
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — puck resistance"

  - category: band_meanings
