  # ── taste → suspect ────────────────────────────────────────────────

  - category: taste_to_suspect
    key: sour
    applies: { signal: ["taste:sour", "taste:sharp", "balance:sour"] }
    value:
      text: >-
        Sour: under-extracted. Expect high flow, an early first drip, or a low
        temperature. Grind finer first; if it is already fine, add 5 g of yield
        and a degree of heat.
      suspects: [flow_high, first_drip_early, temperature_low]
      fix: [grind_finer, yield_up, temperature_up]
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Taste → suspects"

  - category: taste_to_suspect
    key: bitter
    applies: { signal: ["taste:bitter", "taste:harsh", "balance:bitter"] }
    value:
      text: >-
        Bitter: over-extracted. Expect a long shot time, a high temperature, or
        pressure above target. Grind coarser and take a degree off; if it is
        already coarse, take 5 g off the yield and add a decline.
      suspects: [time_long, temperature_high, pressure_above_target]
      fix: [grind_coarser, temperature_down, yield_down]
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Taste → suspects"

  - category: taste_to_suspect
    key: salty
    applies: { signal: ["taste:salty"] }
    value:
      text: >-
        Salty is severe under-extraction — further under than sour. Treat it as
        a grind problem first and a yield problem second.
    unit: none
    confidence: expert
    source: Lance Hedrick / gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Extraction model"

  - category: taste_to_suspect
    key: astringent
    applies: { signal: ["taste:astringent", "taste:drying"] }
    value:
      text: >-
        Astringent and drying: a pressure spike followed by a drop, erratic flow,
        or fines migration. Look at puck prep before touching the grind.
      suspects: [pressure_spike_then_drop, flow_erratic, fines]
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Taste → suspects"

  - category: taste_to_suspect
    key: watery
    applies: { signal: ["taste:weak_watery", "taste:thin"] }
    value:
      text: >-
        Watery or thin: low pressure and high flow. That is a strength problem,
        not an extraction one — shorten the ratio or raise the dose before
        changing the grind.
      suspects: [pressure_low, flow_high, time_short]
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Taste → suspects"

  - category: taste_to_suspect
    key: flat
    applies: { signal: ["taste:hollow", "taste:quick_finish"] }
    value:
      text: >-
        Flat or hollow: temperature drift, a pre-infusion that was too short, or
        stale beans. Raise the temperature half a degree or add a decline phase.
      suspects: [temperature_drift, preinfusion_short, beans_stale]
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Taste → suspects"

  - category: taste_to_suspect
    key: too_intense
    applies: { signal: ["taste:too_intense"] }
    value:
      text: >-
        Too intense or muddy: the cup is over-concentrated rather than
        over-extracted. Lengthen the ratio before doing anything to the grind,
        and take a bar off for a muddy natural.
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Taste → suspects"

  - category: taste_to_suspect
    key: sour_and_bitter_is_channeling
    # Both sides at once, which is why it keys on the one token the context
    # only emits when both are present. An any-of list would fire this on a
    # plainly sour cup and tell the user not to grind finer — the opposite of
    # what `sour` says one rule above.
    applies: { signal: ["taste:sour_and_bitter"] }
    value:
      text: >-
        Sour AND bitter in the same cup is channeling, not an extraction level —
        part of the bed over-extracted while the rest was barely touched. Do NOT
        grind finer. Fix distribution (WDT, level tamp), extend pre-infusion by
        5-8 s at 2-2.5 ml/s, and bloom for very fresh beans.
      do_not: [grind_finer]
      fix: [puck_prep, preinfusion_longer]
    unit: none
    confidence: expert
    source: Scott Rao / gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Channeling (Rao)"

  # ── telemetry → cause ──────────────────────────────────────────────

  - category: telemetry_to_cause
    key: first_drip_fast
    applies: { signal: ["first_drip:fast"] }
    value:
      text: "First drip under 3 s: the grind is too coarse, or the water channelled straight through."
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: first_drip_slow
    applies: { signal: ["first_drip:slow"] }
    value: { text: "First drip past 10 s: the grind is very fine, or the dose is above the basket." }
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: flow_high
    applies: { signal: ["avg_flow:high"] }
    value: { text: "Average flow above 3 ml/s means low bed resistance: too coarse, underdosed, or channelling." }
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: flow_low
    applies: { signal: ["avg_flow:low"] }
    value: { text: "Average flow under 1 ml/s is a choked puck: too fine, or too much coffee for the basket." }
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: late_flow_runaway
    applies: { signal: ["primary:late_flow_runaway"] }
    value:
      text: >-
        Flow accelerating late — say 1.5 climbing to 4 ml/s — is a channel
        opening part-way through, not a profile doing what it was told.
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: pressure_cliff
    applies: { signal: ["primary:pressure_cliff"] }
    value:
      text: >-
        A pressure drop of 1.5 bar/s or worse is the shape a channel opening
        makes: the bed gave way and the pump lost its load.
    unit: none
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — channeling indicators"

  - category: telemetry_to_cause
    key: flow_jitter
    applies: { signal: ["primary:flow_jitter"] }
    value:
      text: >-
        Sample-to-sample flow jitter above 0.05 ml/s is puck instability with
        the designed trajectory removed — calibrated against 26 real shots that
        all measured 0.013-0.020.
    unit: ml_s
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — channeling indicators"

  - category: telemetry_to_cause
    key: flow_vs_target
    applies: { signal: ["primary:flow_vs_target"] }
    value:
      text: >-
        Deviation from the commanded flow is the better grind signal, because
        the PID drives pump power to hold pressure and masks pressure error
        entirely. Overshoot beyond 0.7 ml/s reads as too coarse, undershoot
        beyond 0.7 as too fine.
      threshold_ml_s: 0.7
    unit: ml_s
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — compliance"

  - category: telemetry_to_cause
    key: two_indicators_rule
    applies: { signal: ["primary:flow_jitter", "primary:flow_vs_target",
                    "primary:pressure_cliff", "primary:late_flow_runaway",
                    "primary:pressure_jitter_fallback",
                    "channeling_risk:MODERATE", "channeling_risk:HIGH",
                    "channeling_risk:VERY_HIGH"] }
    value:
      text: >-
        Two aligned channeling indicators mean a real channel; one on its own is
        usually noise. Say which ones fired rather than asserting channeling.
      min_indicators: 2
    unit: none
    confidence: calibrated
    source: crema
    source_ref: "crema.md §4 — channeling"

  - category: telemetry_to_cause
    key: resistance_high_and_falling
    applies: { signal: ["resistance_level:HIGH", "resistance_level:VERY_HIGH"] }
    value:
      text: >-
        High puck resistance with a steep decline is too fine plus channeling:
        the bed was tight enough to force a path and then lost structure. Low
        resistance that increases is too coarse with fines settling.
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: temperature_cold_start
    applies: { signal: ["temp:cold"] }
    value:
      text: >-
        More than 3 °C below target means the group was not up to heat — a
        pre-heat problem, not a PID one. Flush and pull again before changing
        anything.
      threshold_c: 3
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: temperature_over
    applies: { signal: ["temp:hot"] }
    value:
      text: "More than 2 °C above target through the shot is a PID problem, not a recipe one."
      threshold_c: 2
    unit: c
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: scale_artifacts
    applies: { signal: ["scale:absent"] }
    value:
      text: >-
        With no scale the final weight is the device's own estimate. BLE scales
        also spike or drop to zero at the end of a shot; when the reading looks
        wrong, use the last stable value or volume x 0.82 rather than the number
        on the row.
      volume_to_weight: 0.82
    unit: none
    confidence: anecdotal
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Telemetry → diagnosis"

  - category: telemetry_to_cause
    key: dose_out_tiny
    applies: { signal: ["yield:tiny", "scale:absent"] }
    value:
      text: >-
        A recorded yield of about 0.1 g means the cup was taken off the scale
        early, not that the shot failed. The firmware's predictive stop also
        cuts about a second before the target.
    unit: none
    confidence: anecdotal
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Equipment"

  # ── profile design defaults ────────────────────────────────────────

  - category: profile_design_defaults
    key: preinfusion
    applies: { signal: ["primary:flow_jitter", "primary:flow_vs_target",
                    "primary:pressure_cliff", "primary:late_flow_runaway",
                    "primary:pressure_jitter_fallback", "first_drip:fast",
                    "channeling_risk:MODERATE", "channeling_risk:HIGH",
                    "channeling_risk:VERY_HIGH"] }
    value:
      text: >-
        Pre-infusion: 2-3 ml/s for 3-10 s, held under 4 bar so the bed sets
        before it is loaded.
      flow_min_ml_s: 2
      flow_max_ml_s: 3
      seconds_min: 3
      seconds_max: 10
      max_bar: 4
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Profile design"

  - category: profile_design_defaults
    key: bloom
    applies: { style: [bloom] }
    value:
      text: "A bloom is the pump OFF for 5-15 s — not the valve closed. The valve stays at 1."
      seconds_min: 5
      seconds_max: 15
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Profile design"

  - category: profile_design_defaults
    key: ramp
    applies: { signal: ["pressure_overshoot:NOTABLE_OVERSHOOT",
                    "pressure_overshoot:SEVERE_OVERSHOOT"] }
    value:
      text: "Ramp to pressure over 3-5 s with a `pressure gte 8.5` exit condition, then hold."
      seconds_min: 3
      seconds_max: 5
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Profile design"

  - category: profile_design_defaults
    key: hold
    applies: { style: [classic, bloom, lever, allonge, dark, turbo] }
    value:
      text: "Hold for 15-30 s with a volumetric target on it, so the shot ends on weight and not on time."
      seconds_min: 15
      seconds_max: 30
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Profile design"

  - category: profile_design_defaults
    key: decline
    applies: { roast_level: [medium-dark, dark] }
    value:
      text: "Dark roasts want a 3-6 s ease-out decline at the end rather than a flat hold."
      seconds_min: 3
      seconds_max: 6
    unit: seconds
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Profile design"

  - category: profile_design_defaults
    key: final_target
    applies: { signal: ["scale:absent", "yield:tiny"] }
    value:
      text: >-
        Always end on a volumetric target — or, with no scale, a pumped target of
        about the yield plus 25-30 ml for what the puck and group retain.
      pumped_headroom_ml_min: 25
      pumped_headroom_ml_max: 30
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Profile design"

  - category: profile_design_defaults
    key: flow_led
    applies: { style: [turbo, allonge] }
    value:
      text: >-
        Flow-led (the Automatic Pro pattern): target flow = dose x 2 / 20 s, with
        a pressure ceiling — 12 bar capped for the first 6 s, 9 bar for the brew.
        Pre-infusion water = dose x 1.3 + headspace.
      flow_formula: "dose_g * 2 / 20"
      preinfusion_ml: "dose_g * 1.3 + headspace_ml"
      cap_start_bar: 12
      cap_brew_bar: 9
    unit: none
    confidence: anecdotal
    source: modsmthng (Automatic Pro), via gaggimate-mcp
    source_ref: "gaggimate-mcp.md §7 — Profile design"

  # ── equipment ──────────────────────────────────────────────────────

  - category: equipment_hints
    key: conical
    applies: { burr_type: [conical] }
    value:
      text: >-
        Conical burrs make more fines: run 7-8 bar with a gentle ramp and a
        longer pre-infusion, and expect a tighter bed at the same setting than a
        flat burr would give.
      pressure_min_bar: 7
      pressure_max_bar: 8
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Equipment"

  - category: equipment_hints
    key: flat
    applies: { burr_type: [flat] }
    value:
      text: >-
        Flat burrs produce fewer fines and a more unimodal grind: 9 bar suits
        them, and they can usually be run a step finer than a conical.
      pressure_bar: 9
    unit: bar
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Equipment"

  - category: equipment_hints
    key: unknown_burrs
    applies: { burr_type: [unknown] }
    value:
      text: >-
        The grinder's burr type is not recorded, so do not reason about fines.
        Give the adjustment in this grinder's own steps and leave it there.
    unit: none
    confidence: expert
    source: gaggiclanker
    source_ref: "gaggimate-mcp knowledge base (Charlie Hall, MIT)"

  - category: equipment_hints
    key: dose_is_the_basket
    applies: {}
    value:
      text: >-
        Dose to the basket's rating plus or minus 1 g. Underdosing leaves
        headspace, water pools above the puck and channels; a deeper basket wants
        a coarser grind for the same time.
      tolerance_g: 1
    unit: g
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Dose/basket"

  - category: equipment_hints
    key: distribution_before_tamping
    applies: {}
    value:
      text: >-
        Distribution matters more than tamping, and tamping more than pressure.
        Almost every inconsistency that survives a grind change is a
        distribution problem.
      order: [distribution, tamping, pressure]
    unit: none
    confidence: expert
    source: gaggimate-barista
    source_ref: "gaggimate-mcp.md §7 — Extraction science"

  # ── safety bounds ──────────────────────────────────────────────────
  # Always selected: these are the walls, and a suggestion outside them is
  # refused rather than argued with.

  - category: safety_bounds
    key: temperature
    applies: {}
    value:
      text: "Never suggest a brew temperature outside 25-100 °C."
      min_c: 25
      max_c: 100
    unit: c
    confidence: expert
    source: gaggiclanker
    source_ref: "gaggiclanker/db/repos/sets.py — SetVersionPatch bounds"

  - category: safety_bounds
    key: pressure
    applies: {}
    value:
      text: "Never suggest a pressure outside 0-12 bar; the firmware itself refuses more."
      min_bar: 0
      max_bar: 12
    unit: bar
    confidence: expert
    source: GaggiMate firmware
    source_ref: "GaggiMate firmware source"

  - category: safety_bounds
    key: one_step_at_a_time
    applies: {}
    value:
      text: >-
        Never suggest more than one step of one variable in a single shot, and
        never a change larger than the increment rules allow. A big correction is
        two shots, not one.
    unit: none
    confidence: expert
    source: crema
    source_ref: "crema.md §5 — review system prompt"

  - category: safety_bounds
    key: never_invent_data
    applies: {}
    value:
      text: >-
        Never state a measurement that is not in the context. If the dose, the
        grind setting or the taste is missing, ask for it in
        questions_for_user rather than assuming a value.
    unit: none
    confidence: expert
    source: crema
    source_ref: "crema.md §5 — never invent data"
