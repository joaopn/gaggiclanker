# gaggiclanker — one service, one bind mount, one machine on the LAN.
#
#   cp .env.example .env      # then set GAGGIMATE_HOST
#   docker compose up -d
#   open http://localhost:8000        # or http://<this box>:8000 from elsewhere
#
# Networking, which is the only decision this file forces.
#
# **Host networking is the default.** The GaggiMate is a device on your LAN that
# gaggiclanker holds a WebSocket to for days at a time, and sharing the host's
# network stack is the arrangement with the fewest ways to go wrong:
#
#   * mDNS works, so `gaggimate.local` resolves. It does not resolve from a
#     bridge network — a name that works in your browser fails in the container,
#     which is a confusing first hour. (The firmware also disables mDNS entirely
#     when HomeKit is on, so a fixed IP is still the more reliable answer.)
#   * No NAT between a long-lived WebSocket and the machine, and no bridge to
#     time out an idle connection behind your back.
#   * The app listens on PORT (8000 by default) directly on the host, so the
#     UI is at http://<this box>:8000 with no port mapping to reason about.
#
# The cost: `ports:` does not apply, the container shares the host's loopback,
# and Docker Desktop on macOS and Windows does not support it at all.
#
# **The bridge alternative.** Swap the two marked blocks below — comment out
# `network_mode: host`, uncomment `ports:` — and put the machine's IP or a
# DHCP-reserved hostname in GAGGIMATE_HOST. That works whenever the GaggiMate
# has an address routable from the Docker bridge, which on an ordinary home
# network it does. It is the right choice on Docker Desktop, on a box where
# 8000 is already taken (set HOST_PORT), or anywhere you would rather the
# container not see the host's other services. mDNS will not resolve, so
# GAGGIMATE_HOST must be an address, not a name.

services:
  gaggiclanker:
    build:
      context: .
      # Match the host user that owns ./data, so files written into the bind
      # mount are not owned by a uid you cannot delete.
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: gaggiclanker:0.1.0
    # No container_name: a fixed one is global to the daemon, so a second copy
    # of this file (a checkout under another directory, a worktree, a `-p`
    # project for testing) collides with the first instead of getting its own
    # container. Compose already names it <project>-gaggiclanker-1, which is
    # unique per project and still obvious in `docker ps`.
    restart: unless-stopped

    # Everything that must survive a container recreate: the SQLite file, its
    # WAL sidecars, and backups/. One mount, so a backup is a file copy.
    #
    # A bind mount, so the database is a file you can see, copy and restore
    # without docker commands. When this directory does not exist yet, Docker
    # creates it as root:root; the image's entrypoint starts as root, chowns it
    # to the app user, and drops privileges before the app runs — so a fresh
    # `docker compose up -d --build` works with no preparation.
    #
    # To use a named volume instead, swap the two blocks below and uncomment
    # the top-level `volumes:` key at the end of this file. Find the files with
    #   docker volume inspect gaggiclanker-data     # .[0].Mountpoint
    # and back them up with
    #   docker run --rm -v gaggiclanker-data:/d -v "$PWD:/out" alpine \
    #     tar czf /out/gaggiclanker-data.tgz -C /d .
    volumes:
      - ./data:/app/data
      # - gaggiclanker-data:/app/data

    # --- Networking: host by default. See the note at the top of this file. ---
    #
    # `ports:` and `network_mode: host` are mutually exclusive; exactly one of
    # the two blocks below is active at a time.
    network_mode: host

    # The bridge alternative: comment out `network_mode:` above and uncomment
    # this. GAGGIMATE_HOST must then be an IP or a DHCP-reserved hostname,
    # because mDNS does not resolve from a bridge network.
    # ports:
    #   - "${HOST_PORT:-8000}:8000"

    environment:
      # Hostname or IP of the display board. Required for anything to sync.
      GAGGIMATE_HOST: ${GAGGIMATE_HOST:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Passed through only when set on the host or in .env, so an unset key
      # does not shadow one stored in the settings table.
      GAGGICLANKER_LLM_API_KEY: ${GAGGICLANKER_LLM_API_KEY:-}
      # Auth is off unless a username and a password reach the container. They
      # are listed here as well as coming in through env_file so that
      #   AUTH_USER=me AUTH_PASSWORD=... docker compose up -d
      # works: a variable set only in the invoking shell reaches the container
      # only if this file names it.
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}

    env_file:
      - path: .env
        required: false

    # PORT is read from the environment rather than baked in, the way the
    # Dockerfile's own HEALTHCHECK does it: with host networking the operator
    # may well move the app off 8000, and a healthcheck pointing at the old
    # port reports a perfectly healthy container as unhealthy for ever.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('PORT','8000'), timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # The app parses binary shot files off the network and can spawn
    # `claude -p`, so the blast radius is worth shrinking: drop everything, then
    # add back only what the entrypoint needs to hand DATA_DIR to the app user
    # and drop to it. The application process itself holds none of these — by
    # the time it starts, setpriv has left it unprivileged.
    cap_drop:
      - ALL
    # FOWNER and DAC_OVERRIDE are deliberately absent: the entrypoint runs as
    # uid 0, which owns the tree it walks, so plain DAC already permits the
    # traversal and CAP_CHOWN alone covers the ownership change.
    cap_add:
      - CHOWN   # chown the data directory to the app user
      - SETUID  # setpriv: drop to the app uid
      - SETGID  # setpriv: drop to the app gid
      - SETPCAP # setpriv: empty the bounding set so the app cannot regain any
    security_opt:
      # setpriv only ever drops privileges, so this does not interfere with it.
      # Together with --bounding-set=-all the app process ends up with an empty
      # CapBnd: verify with
      #   docker compose exec gaggiclanker grep CapBnd /proc/1/status  # -> 0000...000
      - no-new-privileges:true

    # Shot ingest is bursty but small; this is a guard against a runaway loop,
    # not a tuning knob.
    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Uncomment together with the `gaggiclanker-data` line in `volumes:` above.
# volumes:
#   gaggiclanker-data:
